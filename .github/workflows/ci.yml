name: CI

on:
  push:
    branches:
      - main
      - release
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIXI_FROZEN: true

jobs:
  formatting:
    name: Formatting and static analysis
    runs-on: 'ubuntu-24.04'
    steps:
      - uses: actions/checkout@v6
      - uses: prefix-dev/setup-pixi@v0.9.4
        with:
          pixi-version: v0.74.0
          environments: lint
      - run: pixi run -e lint lint
      - uses: pre-commit-ci/lite-action@v1.1.0
        if: always()
        with:
          msg: Apply automatic formatting

  tests:
    name: ${{ matrix.name }}
    needs: formatting
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Tests
            os: 'ubuntu-24.04'
            environment: default
            task: test
          # Mantid is not available for win-64, see the comment in pixi.toml.
          - name: Mantid tests
            os: 'ubuntu-24.04'
            environment: mantid
            task: test-mantid
          - name: Tests (macOS)
            os: 'macos-latest'
            environment: default
            task: test
          - name: Tests (Windows)
            os: 'windows-latest'
            environment: default
            task: test
    runs-on: ${{ matrix.os }}
    env:
      ESS_PROTECTED_FILESTORE_USERNAME: ${{ secrets.ESS_PROTECTED_FILESTORE_USERNAME }}
      ESS_PROTECTED_FILESTORE_PASSWORD: ${{ secrets.ESS_PROTECTED_FILESTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # history required so setuptools_scm can determine the version
      - uses: prefix-dev/setup-pixi@v0.9.4
        with:
          pixi-version: v0.74.0
          environments: ${{ matrix.environment }}
      - run: pixi run -e ${{ matrix.environment }} ${{ matrix.task }}

  sqw:
    name: SQW/Horace tests
    needs: formatting
    runs-on: 'ubuntu-24.04'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # history required so setuptools_scm can determine the version
      # pace_neutrons needs a MATLAB runtime. It imports fine without one, so these
      # tests do not skip themselves, which is why they are kept out of the regular
      # test job rather than run there.
      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          cache: true
          products: "MATLAB_Compiler_SDK"
      - uses: prefix-dev/setup-pixi@v0.9.4
        with:
          pixi-version: v0.74.0
          environments: sqw
      - run: pixi run -e sqw test-sqw

  package:
    name: Package installs from a wheel
    needs: formatting
    runs-on: 'ubuntu-24.04'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # history required so setuptools_scm can determine the version
      # Deliberately does not use pixi: this checks that a plain, non-editable
      # install of the package works, as a user would get it.
      - uses: actions/setup-python@v6
        with:
          python-version-file: '.github/workflows/python-version-ci'
      - run: python -m pip install .
      - run: python tests/package_test.py

  docs:
    needs: [tests, sqw, package]
    uses: ./.github/workflows/docs.yml
    with:
      publish: false
      linkcheck: ${{ github.ref == 'refs/heads/main' }}
      branch: ${{ github.head_ref == '' && github.ref_name || github.head_ref }}
    secrets: inherit
