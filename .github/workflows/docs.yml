name: Docs

on:
  workflow_dispatch:
    inputs:
      publish:
        default: false
        type: boolean
      branch:
        description: 'Branch/tag with documentation source. If not set, the current branch will be used.'
        default: ''
        required: false
        type: string
      linkcheck:
        description: 'Run the link checker. If not set the link checker will not be run.'
        default: false
        required: false
        type: boolean
  workflow_call:
    inputs:
      publish:
        default: false
        type: boolean
      branch:
        description: 'Branch/tag with documentation source. If not set, the current branch will be used.'
        default: ''
        required: false
        type: string
      linkcheck:
        description: 'Run the link checker. If not set the link checker will not be run.'
        default: false
        required: false
        type: boolean

env:
  PIXI_FROZEN: true

jobs:
  docs:
    name: Build documentation
    runs-on: 'ubuntu-24.04'
    env:
        ESS_PROTECTED_FILESTORE_USERNAME: ${{ secrets.ESS_PROTECTED_FILESTORE_USERNAME }}
        ESS_PROTECTED_FILESTORE_PASSWORD: ${{ secrets.ESS_PROTECTED_FILESTORE_PASSWORD }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch == '' && github.ref_name || inputs.branch }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0  # history required so setuptools_scm can determine the version
      # pandoc and graphviz come from the docs environment, so there is nothing to
      # install with apt here.
      - uses: prefix-dev/setup-pixi@v0.9.4
        with:
          pixi-version: v0.74.0
          environments: docs
      - run: pixi run docs doctest
      - run: pixi run docs html
      - run: pixi run docs linkcheck
        if: ${{ inputs.linkcheck }}
      - run: find html -type f -name "*.ipynb" -not -path "html/_sources/*" -delete
      - uses: actions/upload-artifact@v7
        id: artifact-upload-step
        with:
          name: docs_html
          path: html/
          if-no-files-found: error
      - run: echo "::notice::https://remote-unzip.scipp.deno.net/${{ github.repository }}/artifacts/${{ steps.artifact-upload-step.outputs.artifact-id }}"

      - uses: JamesIves/github-pages-deploy-action@v4
        if: ${{ inputs.publish }}
        with:
          branch: gh-pages
          folder: html
          single-commit: true
