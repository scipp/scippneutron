name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

env:
  PIXI_FROZEN: true

jobs:
  build_wheels:
    name: Wheels
    runs-on: 'ubuntu-24.04'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # history required so setuptools_scm can determine version
          persist-credentials: false

      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347  # v0.10.1
        with:
          pixi-version: v0.77.0
          environments: build
          locked: true

      - name: Build wheels
        run: pixi run -e build check-build

      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist

  upload_pypi:
    name: Deploy PyPI
    needs: [build_wheels]
    runs-on: 'ubuntu-24.04'
    environment: release
    permissions:
      id-token: write
    if: github.event_name == 'release' && github.event.action == 'published'
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2

  docs:
    needs: [upload_pypi]
    permissions:
      contents: write
    uses: ./.github/workflows/docs.yml
    with:
      publish: ${{ github.event_name == 'release' && github.event.action == 'published' }}
    secrets:
      ESS_PROTECTED_FILESTORE_USERNAME: ${{ secrets.ESS_PROTECTED_FILESTORE_USERNAME }}
      ESS_PROTECTED_FILESTORE_PASSWORD: ${{ secrets.ESS_PROTECTED_FILESTORE_PASSWORD }}

  assets:
    name: Upload docs
    needs: docs
    runs-on: 'ubuntu-24.04'
    permissions:
      contents: write  # This is needed so that the action can upload the asset
    steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
          name: docs_html
          path: docs_html
    - name: Zip documentation
      id: archive
      env:
        RELEASE_REF_NAME: ${{ github.ref_name }}
      run: |
        archive="documentation-${RELEASE_REF_NAME//\//-}"
        mv docs_html "$archive"
        zip -r "${archive}.zip" "$archive"
        printf 'file=%s\n' "${archive}.zip" >> "$GITHUB_OUTPUT"
    - name: Upload release assets
      uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de  # 2.11.5
      with:
        file: ${{ steps.archive.outputs.file }}
        overwrite: false
